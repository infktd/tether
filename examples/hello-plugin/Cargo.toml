[package]
name = "hello-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A small example plugin: a page with stats, a table, a card and tabs, built on tether-plugin-sdk."

# CI builds and lints every crate tagged like this for its target.
[package.metadata.tether]
target = "wasm32-wasip2"

[lib]
crate-type = ["cdylib"]

# Same as the workspace lints minus `unsafe_code = "forbid"`: wit-bindgen's
# generated ABI glue needs `unsafe`, and a crate can't partially override
# workspace lints. Guest code is sandboxed by Wasmtime regardless.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
tether-plugin-sdk.workspace = true
