# Structures, a first-party Tether plugin (aa-structures).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.structures"
name = "Structures"
icon = "citadel"
version = "0.5.13"
host_api = "1"
description = "Owners' Upwell structures, starbases, customs offices, skyhooks and jump gates with fuel, fittings, state, timers and tags; their notifications relayed to Discord per owner by type with pings by severity and ping groups, fuel alerts, and notices to admins."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
# mention_groups: aa-structures' ping groups, per owner and per channel
# (its webhooks), ping those groups' Discord roles.
discord = ["send_message", "mention_groups"]
# Structures' timers go to Structure Timers, as aa-structures feeds the
# timerboard.
timers = "publish"
# Admins (superusers and holders of manage) hear of owners added and of an
# owner's services down, restored or enabled, as aa-structures'
# notify_admins (STRUCTURES_ADMIN_NOTIFICATIONS_ENABLED).
notify = true

[capabilities.esi]
# Through each owner (data-source character, AA's structure owner): its
# corporation's structures (needs the in-game Station Manager role) and
# its own structure notifications; starbases, customs offices and assets
# (fittings, Metenox fuel, skyhooks) need the Director role, and are
# skipped for an owner without it.
data_source = [
    "esi-corporations.read_structures.v1",
    "esi-characters.read_notifications.v1",
    "esi-corporations.read_starbases.v1",
    "esi-planets.read_customs_offices.v1",
    "esi-assets.read_corporation_assets.v1",
]

# Notifications cache for 10 minutes at ESI, structures for an hour: the
# sync reads each no more often than that.
[[capabilities.schedules]]
name = "sync"
every = "10m"

# aa-structures' names. Grant Member basic_access and
# view_corporation_structures (or view_alliance_structures); leadership
# view_all_structures, view_all_unanchoring_status, view_structure_fit and
# manage; Station Managers add_structure_owner.
[permissions]
basic_access = "Open Structures (it shows the structures the view permissions allow)"
view_corporation_structures = "See the structures of your main's corporation"
view_alliance_structures = "See the structures of every corporation in your main's alliance"
view_all_structures = "See every owner's structures"
view_structure_fit = "See structures' fittings"
view_all_unanchoring_status = "Can view unanchoring timers for all structures the user can see"
add_structure_owner = "Can add structure owner: one of your Station Managers, whose corporation's structures are read at once"
manage = "Manage Structures: Discord channels, notification types and pings, fuel alerts, tags and owners' syncing"

# Who each is usually for, and what holding it means (Permissions shows
# these under the descriptions).
[permission_notes]
basic_access = "Usually Member. It opens Structures and its public customs office list; which structures it shows depends on the view permissions, so on its own it shows none."
view_corporation_structures = "Usually Member: each pilot sees the structures, fuel and timers of their main's own corporation."
view_alliance_structures = "For alliance officers, or Member in a close alliance: every member corporation's structures, fuel and timers."
view_all_structures = "For leadership and logistics: every owner's structures, whichever corporation or alliance the pilot is in."
view_structure_fit = "For leadership: an Upwell structure's fitting, fighters, fuel bay, quantum core and moon material bay show how it would hold up, so keep it to those who need it. As in aa-structures, whether it has a core, a starbase's fuel bay and a jump gate's liquid ozone show to everyone who may see the structure."
view_all_unanchoring_status = "For leadership. Holders see which structures are unanchoring and when; everyone else sees their usual state with no unanchoring time, so a move or a sale stays quiet."
add_structure_owner = "For Station Managers and directors who add their corporation: holders add a data source, a character with the in-game Station Manager role (Director for starbases, customs offices and fittings)."
manage = "For the officers who run Structures: the Discord channels, pings, notification types, fuel alerts, tags and owners' syncing. Holders also get its admin notices (owners added, an owner's reads down or back), with superusers."

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "settings"
permission = "manage"

[[navigation]]
label = "Structures"
path = ""
section = "industry"

[[views]]
label = "Overview"
path = ""

[[views]]
label = "Customs offices"
path = "pocos"
