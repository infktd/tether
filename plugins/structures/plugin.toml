# Structures, a first-party Tether plugin (aa-structures).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.structures"
name = "Structures"
version = "0.5.1"
host_api = "1"
description = "Owners' Upwell structures, starbases, customs offices and skyhooks with fuel, fittings, state, timers and tags; their notifications relayed to Discord per owner by type with pings by severity, and fuel alerts."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
discord = ["send_message"]
# Structures' timers go to Structure Timers, as aa-structures feeds the
# timerboard.
timers = "publish"

[capabilities.esi]
# Through each owner (data-source character, AA's structure owner): its
# corporation's structures (needs the in-game Station Manager role) and
# its own structure notifications; starbases, customs offices and assets
# (fittings, Metenox fuel, skyhooks) need the Director role, and are
# skipped for an owner without it.
data_source = [
    "esi-corporations.read_structures.v1",
    "esi-characters.read_notifications.v1",
    "esi-corporations.read_starbases.v1",
    "esi-planets.read_customs_offices.v1",
    "esi-assets.read_corporation_assets.v1",
]

# Notifications cache for 10 minutes at ESI, structures for an hour: the
# sync reads each no more often than that.
[[capabilities.schedules]]
name = "sync"
every = "10m"

# aa-structures' names. Grant Member basic_access and
# view_corporation_structures (or view_alliance_structures); leadership
# view_all_structures, view_all_unanchoring_status, view_structure_fit and
# manage; Station Managers add_structure_owner.
[permissions]
basic_access = "Open Structures (it shows the structures the view permissions allow)"
view_corporation_structures = "See the structures of your main's corporation"
view_alliance_structures = "See the structures of every corporation in your main's alliance"
view_all_structures = "See every owner's structures"
view_structure_fit = "See structures' fittings"
view_all_unanchoring_status = "Can view unanchoring timers for all structures the user can see"
add_structure_owner = "Can add structure owner: one of your Station Managers, whose corporation's structures are read at once"
manage = "Manage Structures: Discord channels, notification types and pings, fuel alerts, tags and owners' syncing"

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "settings"
permission = "manage"

[[navigation]]
label = "Structures"
path = ""
section = "industry"
