[package]
name = "blueprints"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Blueprints for Tether: the corporations' and pilots' blueprint library and requests for copies, as aa-blueprints."

# CI builds and lints every crate tagged like this for its target.
[package.metadata.tether]
target = "wasm32-wasip2"

[lib]
crate-type = ["cdylib"]

# Same as the workspace lints minus `unsafe_code = "forbid"`: wit-bindgen's
# generated ABI glue needs `unsafe`, and a crate can't partially override
# workspace lints. Guest code is sandboxed by Wasmtime regardless.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
chrono.workspace = true
tether-plugin-sdk.workspace = true
serde_json.workspace = true
