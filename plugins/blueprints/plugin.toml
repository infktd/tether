# Blueprints, a first-party Tether plugin: aa-blueprints (AA's Blueprint
# Library; Jay, 2026-10-04). `scripts/package-plugin.sh` builds, zips and
# signs it, putting the publisher's key in below.
[plugin]
id = "tether.blueprints"
name = "Blueprints"
icon = "blueprint"
version = "0.1.11"
host_api = "1"
description = "The corporations' and pilots' blueprint library, with ME, TE, runs, where each is and what's running, and requests for copies the owners fulfil."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
discord = ["send_message"]
# Requesters and approvers hear about requests in Tether's notifications,
# as AA's notify (Jay, 2026-10-04).
notify = true

# Corporate owners (AA's add_corporate_blueprint_owner): a Director's
# character, whose corporation's blueprints, jobs and assets are read.
# Personal owners register a character with the user scopes instead.
[capabilities.esi]
data_source = [
    "esi-corporations.read_blueprints.v1",
    "esi-industry.read_corporation_jobs.v1",
    "esi-assets.read_corporation_assets.v1",
    "esi-universe.read_structures.v1",
]
user = [
    "esi-characters.read_blueprints.v1",
    "esi-industry.read_character_jobs.v1",
    "esi-assets.read_assets.v1",
    "esi-universe.read_structures.v1",
]
owner_permissions = ["add_corporate_blueprint_owner"]

# aa-blueprints' periodic tasks: blueprints every 3 hours, industry jobs
# every hour, locations every 12 hours.
[[capabilities.schedules]]
name = "sync_blueprints"
every = "3h"

[[capabilities.schedules]]
name = "sync_jobs"
every = "1h"

[[capabilities.schedules]]
name = "sync_places"
every = "12h"

# aa-blueprints' permissions, and Tether's manage for Settings.
[permissions]
basic_access = "Can access this app"
request_blueprints = "Can request blueprints"
manage_requests = "Can review and accept blueprint requests"
add_personal_blueprint_owner = "Can add personal blueprint owners"
add_corporate_blueprint_owner = "Can add corporate blueprint owners (give it only to directors or the CEO)"
view_alliance_blueprints = "Can view alliance's blueprints"
view_blueprint_locations = "Can view the location of all blueprints"
view_industry_jobs = "Can view details about running industry jobs (all of them)"
manage = "Change the Discord channel new requests are posted to"

# Who each permission is usually for, under it on Permissions.
[permission_notes]
basic_access = "Usually Member. Holders see the library: the blueprints of owners in their corporations, or their alliance with the alliance-wide permission. Without it nobody opens the app."
request_blueprints = "Usually Member, for pilots who build. Holders ask the owners' builders for copies of any blueprint they can see, and hear back in their notifications."
manage_requests = "For the builders who make copies. Holders take, fulfil, re-open or cancel requests for their own corporation's or own characters' blueprints only."
add_personal_blueprint_owner = "Usually Member. Holders add their own registered characters' blueprints to the library, where their corporation sees them."
add_corporate_blueprint_owner = "For directors or the CEO only: holders add a Director's character whose corporation's blueprints, industry jobs and assets the app then reads."
view_alliance_blueprints = "For alliance industry staff. Holders see the blueprints of every owner in their alliance, not only their own corporations'."
view_blueprint_locations = "For trusted builders and officers. Holders see where each blueprint they can see is kept: the station or structure, office hangar and container."
view_industry_jobs = "For industry officers. Holders see which job runs on each blueprint and until when; others see only that it's in use."
manage = "For those who run the app. Holders pick the Discord channel for new requests, see the last read's problems and turn admin notices on or off. They get those notices too (superusers always do) each time a blueprint owner is added, in any corporation: the corporation's name, or the pilot's character for a personal owner."

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "requests"
permission = "request_blueprints"

[[pages]]
path = "open"
permission = "manage_requests"

[[pages]]
path = "owners"
permission = "add_personal_blueprint_owner"

[[pages]]
path = "settings"
permission = "manage"

[[navigation]]
label = "Blueprints"
path = ""
section = "industry"

[[views]]
label = "Overview"
path = ""

[[views]]
label = "My requests"
path = "requests"

[[views]]
label = "Open requests"
path = "open"

[[views]]
label = "My blueprints"
path = "owners"
