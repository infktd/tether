# Structure Timers, a first-party Tether plugin (Alliance Auth's
# timerboard). `scripts/package-plugin.sh` builds, zips and signs it,
# putting the publisher's key in below.
[plugin]
id = "tether.structure-timers"
name = "Structure Timers"
icon = "clock"
version = "0.2.5"
host_api = "1"
description = "Structure timers in EVE time: upcoming and past, important ones marked, and corporation-only timers seen by the creator's corporation alone."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
# Timers other apps publish (Structures' own structures), shown read-only
# as automatic timers, as aa-structures feeds the timerboard.
timers = "read"

# AA's permission names. Grant Member timer_view; FCs and directors
# timer_management too.
[permissions]
timer_view = "See structure timers"
timer_management = "Create, edit and delete structure timers"

# Who each is usually for, and what holding it means (Permissions shows
# these under the descriptions).
[permission_notes]
timer_view = "Usually Member, and Blue if allies join your fights: everyone who should see upcoming timers. A corporation-only timer still shows only to its corporation."
timer_management = "For FCs and directors who keep the board: holders add timers, and edit or delete anyone's (a corporation-only one only from its corporation; those from Structures change only there)."

[[pages]]
path = ""
permission = "timer_view"

[[pages]]
path = "add"
permission = "timer_management"

[[pages]]
path = "timer"
permission = "timer_management"

[[navigation]]
label = "Structure Timers"
path = ""
section = "fleet"

# The app shell (DESIGN.md): its views, action and Manage pages.
[[views]]
label = "Overview"
path = ""

[action]
label = "New timer"
path = "add"
