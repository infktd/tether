# Ship Replacement, a first-party Tether plugin (Alliance Auth's srp).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.ship-replacement"
name = "Ship Replacement"
icon = "life-buoy"
version = "0.3.4"
host_api = "1"
description = "SRP fleets: pilots request SRP for their losses by zKillboard link; SRP managers approve, reject and set payouts, with totals per fleet."

[publisher]
key = "PUBLISHER_KEY"

# zKillboard (killmail values; approved by Jay as a destination). Losses
# themselves come from ESI's public killmail endpoint through Tether.
[capabilities]
storage = true
http = ["zkillboard.com"]
# aa-srp's SRP team channel: new requests are posted, pinging nobody, to
# the channel Settings picks, none by default.
discord = ["send_message"]

# AA's srp permissions: access_srp for pilots (grant it to Member; they
# see every fleet's requests and totals, as in AA), add_srpfleetmain for
# FCs, srp_management (AA's auth.srp_management) for SRP managers.
[permissions]
access_srp = "Can access the SRP module: see SRP fleets and their requests, and request SRP for your losses"
add_srpfleetmain = "Can add SRP fleets"
srp_management = "Can manage SRP: approve, reject, update amounts and mark paid; add, complete and remove fleets"
# Not in AA (aa-srp's settings live in Django's admin): nobody holds it
# until an admin grants it (superusers do).
manage = "Change the Discord channel new SRP requests are posted to"

[permission_notes]
access_srp = "Usually Member: every pilot who may claim losses. Holders see every SRP fleet with its requests (pilots, ships, amounts, status), as in AA, and request SRP for their own characters' losses."
add_srpfleetmain = "For FCs. Holders add SRP fleets, whose SRP code their pilots request with. Deciding requests takes SRP management."
srp_management = "For SRP managers. Holders approve, reject and price every request, their own included (as in AA), mark them paid, and complete or remove fleets. Removing a fleet frees its losses to be requested again."
manage ="For whoever runs SRP. Holders pick the Discord channel new requests are posted to. Not in AA: aa-srp's setting is changed by superusers in Django's admin, so nobody holds it until granted."

# 0.2 called it manage_srp; its grants move. 0.2's change_srpuserrequest
# is gone (AA has no such permission): srp_management updates amounts.
[renamed_permissions]
manage_srp = "srp_management"

# Add SRP Fleet takes add_srpfleetmain or srp_management, checked by the
# app (under access_srp, as the rest).
[[pages]]
path = ""
permission = "access_srp"

[[pages]]
path = "settings"
permission = "manage"

[[navigation]]
label = "Ship Replacement"
path = ""
section = "fleet"

[[views]]
label = "Overview"
path = ""

[[views]]
label = "All fleets"
path = "all"
