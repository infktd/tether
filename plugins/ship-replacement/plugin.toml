# Ship Replacement, a first-party Tether plugin (Alliance Auth's srp).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.ship-replacement"
name = "Ship Replacement"
icon = "shield"
version = "0.3.2"
host_api = "1"
description = "SRP fleets: pilots request SRP for their losses by zKillboard link; SRP managers approve, reject and set payouts, with totals per fleet."

[publisher]
key = "PUBLISHER_KEY"

# zKillboard (killmail values; approved by Jay as a destination). Losses
# themselves come from ESI's public killmail endpoint through Tether.
[capabilities]
storage = true
http = ["zkillboard.com"]

# AA's srp permissions: access_srp for pilots (grant it to Member; they
# see every fleet's requests and totals, as in AA), add_srpfleetmain for
# FCs, srp_management (AA's auth.srp_management) for SRP managers.
[permissions]
access_srp = "Can access the SRP module: see SRP fleets and their requests, and request SRP for your losses"
add_srpfleetmain = "Can add SRP fleets"
srp_management = "Can manage SRP: approve, reject, update amounts and mark paid; add, complete and remove fleets"

# 0.2 called it manage_srp; its grants move. 0.2's change_srpuserrequest
# is gone (AA has no such permission): srp_management updates amounts.
[renamed_permissions]
manage_srp = "srp_management"

# Add SRP Fleet takes add_srpfleetmain or srp_management, checked by the
# app (under access_srp, as the rest).
[[pages]]
path = ""
permission = "access_srp"

[[navigation]]
label = "Ship Replacement"
path = ""
section = "fleet"
