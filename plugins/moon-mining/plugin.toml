# Moon Mining, a first-party Tether plugin. `scripts/package-plugin.sh`
# builds, zips and signs it, putting the publisher's key in below.
[plugin]
id = "tether.moon-mining"
name = "Moon Mining"
icon = "moon"
version = "0.2.16"
host_api = "1"
description = "Moon extractions, pops and their value, moons from surveys, reports, and an extraction planner for every refinery; optionally pop pings and a Members-only window before Blue see old moons."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
discord = ["send_message"]
# aa-moonmining's admin notices (MOONMINING_ADMIN_NOTIFICATIONS_ENABLED),
# to holders of `manage`, superusers included, as AA's notify_admins.
notify = true

[capabilities.esi]
# From the corporation of each owner (data-source character): a Station
# Manager (extractions, structures), an Accountant (mining observers) and
# a Director or Personnel Manager (who holds Station Manager, for the
# planner).
data_source = [
    "esi-industry.read_corporation_mining.v1",
    "esi-corporations.read_structures.v1",
    "esi-corporations.read_corporation_membership.v1",
]

# aa-moonmining's periodic tasks: refineries and extractions every 10
# minutes (run_regular_updates), every listed observer's mining ledger
# hourly (run_report_updates), values daily. A run out of ESI calls
# carries on a minute later (`sync_more`, `ledger_more`).
[[capabilities.schedules]]
name = "sync"
every = "10m"

[[capabilities.schedules]]
name = "ledger"
every = "1h"

[[capabilities.schedules]]
name = "roles"
every = "1d"

# Moon ores and CCP's prices (ESI's public /markets/prices/).
[[capabilities.schedules]]
name = "prices"
every = "1d"

# aa-moonmining's permissions. Grant Member basic_access,
# extractions_access and upload_moon_scan (Blue basic_access only: Moons,
# or the old-moon list if the optional Members-only window is on); leadership view_all_moons, reports_access,
# view_moon_ledgers; Station Managers or Directors add_refinery_owner.
[permissions]
basic_access = "Can access the moonmining app: the old-moon list and Moons"
extractions_access = "Can access extractions and view owned moons, with mining totals and the extraction planner"
reports_access = "Can access reports: moons' potential income, members' mining, uploads and ore prices"
view_all_moons = "Can view all moons"
upload_moon_scan = "Can upload moon scans, and see the moons they uploaded"
add_refinery_owner = "Can add refinery owner: one of your Station Managers, whose corporation's moons are read at once"
view_moon_ledgers = "Can view moon ledgers: who mined each extraction"
# Not in aa-moonmining (its settings live in Django's admin): nobody holds
# it until an admin grants it.
manage = "Change Moon Mining's settings"

# Who each is usually for, shown under it on Permissions.
[permission_notes]
basic_access = "Usually Member, and Blue if allies may look. Alone it opens Moons, which shows nothing without one of the moon permissions below, and, while the Members-only window is on, the old-moon list (which moons, never when they popped)."
extractions_access = "Usually Member: the pilots who mine your moons. Holders see every extraction with its pop time and value, the owned moons, what each pilot mined (Mining totals) and the planner, which together map out your moon schedule."
reports_access = "For leadership. Holders see what each owned moon could earn a month, what each member mined over four months, who uploaded surveys, and ore prices."
view_all_moons = "For leadership and scouts. Holders see every surveyed moon, owned or not, with its ores and value, but not the extractions behind them."
upload_moon_scan = "Usually Member: anyone with moon surveys to paste. Holders also see the moons they uploaded."
add_refinery_owner = "For Station Managers or Directors. Holders add one of their own characters as an owner, and Moon Mining reads that corporation's extractions, refineries and mining ledgers through it at once."
view_moon_ledgers = "For leadership. With Extractions access, holders see on each extraction's page who mined it and how much."
manage = "For whoever runs Moon Mining. Holders change its settings (pop pings, the Members-only window, values) and get its admin notices: an owner added, or one ESI refuses. Superusers get them anyway."

# What 0.1.0 called them: their grants move on upgrade.
[renamed_permissions]
old = "basic_access"
view = "extractions_access"

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "extraction"
permission = "extractions_access"

[[pages]]
path = "upload"
permission = "upload_moon_scan"

[[pages]]
path = "reports"
permission = "reports_access"

[[pages]]
path = "totals"
permission = "extractions_access"

[[pages]]
path = "planner"
permission = "extractions_access"

[[pages]]
path = "settings"
permission = "manage"

[[navigation]]
label = "Moon Mining"
path = ""
section = "industry"

[[views]]
label = "Overview"
path = ""

[[views]]
label = "Moons"
path = "moons"

[[views]]
label = "Reports"
path = "reports"

[[views]]
label = "Mining totals"
path = "totals"

[[views]]
label = "Planner"
path = "planner"

[action]
label = "Upload moon surveys"
path = "upload"
