# HR Applications, a first-party Tether plugin (Alliance Auth's
# hrapplications). `scripts/package-plugin.sh` builds, zips and signs it,
# putting the publisher's key in below.
[plugin]
id = "tether.hr-applications"
name = "HR Applications"
icon = "clipboard"
version = "0.4.3"
host_api = "1"
description = "Application forms per corporation: pilots apply, recruiters review with comments and approve or reject, applicants follow their status."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

# AA's names where AA has one. As in AA, anyone signed in with a main may
# apply, with no permission (the pages rule below). Recruiters get
# human_resources, and comment, approve, reject and delete as AA splits
# them.
[permissions]
human_resources = "Review applications to your main's corporation: read and mark in progress"
add_applicationcomment = "Can add comments to applications you can review"
approve_application = "Approve applications you're reviewing"
reject_application = "Reject applications you're reviewing"
delete_application = "Delete applications you can review"
manage = "Create and change application forms and their questions"

# Applying, and following your own applications: anyone signed in with a
# main, as AA's login_required views.
[[pages]]
path = ""
signed_in = true

[[pages]]
path = "review"
permission = "human_resources"

[[pages]]
path = "forms"
permission = "manage"

[[navigation]]
label = "Applications"
path = ""
section = "corporation"

[[views]]
label = "Overview"
path = ""

[[views]]
label = "Review"
path = "review"

[action]
label = "Apply"
path = "create"

[[manage]]
label = "Application forms"
path = "forms"
