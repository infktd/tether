# Time Zones, a first-party Tether plugin (aa-timezones).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.timezones"
name = "Time Zones"
icon = "globe"
version = "0.1.4"
host_api = "1"
description = "EVE time beside other time zones, and every one of them at a time you pick: a reinforcement timer or a planned fleet, with a link to share."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

# aa-timezones has no permissions (anyone logged in, as here); its panels
# are set in AA's admin site, here by `manage`.
[permissions]
manage = "Configure the time zone panels"

# Who each is usually for, shown under it on Permissions.
[permission_notes]
manage = "For whoever sets up the alliance's clocks. Holders add and delete the time zone panels everyone sees; anyone signed in can look without it."

# Anyone signed in with a main, as aa-timezones.
[[pages]]
path = ""
signed_in = true

[[pages]]
path = "panels"
permission = "manage"

[[navigation]]
label = "Time Zones"
path = ""

# The app shell (DESIGN.md): its views, action and Manage pages.
[[views]]
label = "Overview"
path = ""

[[views]]
label = "Your time zone"
path = "mine"

[action]
label = "Adjust time"
path = "adjust"

[[manage]]
label = "Panels"
path = "panels"
