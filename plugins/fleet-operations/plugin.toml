# Fleet Operations, a first-party Tether plugin (Alliance Auth's optimer).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.fleet-operations"
name = "Fleet Operations"
icon = "crosshair"
version = "0.1.4"
host_api = "1"
description = "Fleet operations in EVE time: upcoming and past ops with doctrine, form-up system, FC and type, counting down, and the next ones on the Dashboard."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

# AA's permissions (auth.optimer_view, auth.optimer_management), gating
# the same pages as AA's views. Grant Member optimer_view; FCs
# optimer_management too.
[permissions]
optimer_view = "See fleet operations"
optimer_management = "Create, edit and delete fleet operations"

# Who each is usually for, shown under it on Permissions.
[permission_notes]
optimer_view = "Usually Member: everyone who flies your fleets. Holders see upcoming and past operations with their form-up, start time and doctrine, so it shows your op schedule."
optimer_management = "For FCs and fleet officers, with See fleet operations too. Holders post operations, and edit and delete anyone's."

[[pages]]
path = ""
permission = "optimer_view"

[[pages]]
path = "add"
permission = "optimer_management"

[[pages]]
path = "op"
permission = "optimer_management"

[[navigation]]
label = "Fleet Operations"
path = ""
section = "fleet"

# The app shell (DESIGN.md): its views, action and Manage pages.
[[views]]
label = "Overview"
path = ""

[action]
label = "New operation"
path = "add"
