# Contacts, a first-party Tether plugin (aa-contacts).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.contacts"
name = "Contacts"
icon = "book"
version = "0.1.5"
host_api = "1"
description = "Alliance and corporation contacts with their standings and labels, notes and server links, for the members of each."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

# Approved by Jay (2026-09-27): each owner's corporation's and alliance's
# contacts. AA's manage permissions add the owners, as aa-contacts' tokens;
# unlike aa-contacts, an owner brings both, whichever of them added it (apps
# don't learn who added an owner).
[capabilities.esi]
data_source = ["esi-alliances.read_contacts.v1", "esi-corporations.read_contacts.v1"]
owner_permissions = ["manage_alliance_contacts", "manage_corporation_contacts"]

# Hourly, as aa-contacts' task.
[[capabilities.schedules]]
name = "update"
every = "1h"

# aa-contacts' permission names.
[permissions]
manage_alliance_contacts = "Can add tokens for the alliance and trigger manual updates"
manage_corporation_contacts = "Can add tokens for the corporation and trigger manual updates"
view_alliance_notes = "Can view notes on alliance contacts"
view_corporation_notes = "Can view notes on corporation contacts"
view_alliance_server_links = "Can view server links (and their passwords) on alliance contacts"
view_corporation_server_links = "Can view server links (and their passwords) on corporation contacts"

[permission_notes]
manage_alliance_contacts = "For the alliance's diplomats. Holders add data sources (each brings its corporation's and alliance's contacts) and update the alliance's contacts now; with the view permissions, they also edit notes and server links."
manage_corporation_contacts = "For a corporation's diplomats. Holders add data sources (each brings its corporation's and alliance's contacts) and update the corporation's contacts now; with the view permissions, they also edit notes and server links."
view_alliance_notes = "For the alliance's diplomats. Holders read the notes on their alliance's contacts; editing them takes managing alliance contacts too."
view_corporation_notes = "For a corporation's diplomats. Holders read the notes on their corporation's contacts; editing them takes managing corporation contacts too."
view_alliance_server_links = "For diplomats who need allies' comms. Holders see the server links on their alliance's contacts, passwords included, so keep it to trusted staff."
view_corporation_server_links = "For diplomats who need allies' comms. Holders see the server links on their corporation's contacts, passwords included, so keep it to trusted staff."

# Anyone signed in sees the alliances and corporations they have a
# character in, as aa-contacts.
[[pages]]
path = ""
signed_in = true

[[navigation]]
label = "Contacts"
path = ""
section = "corporation"

# The app shell (DESIGN.md): its views, action and Manage pages.
[[views]]
label = "Overview"
path = ""
