# Freight, a first-party Tether plugin (aa-freight).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.freight"
name = "Freight"
icon = "box"
version = "0.1.7"
host_api = "1"
description = "A central freight service: priced routes, a reward calculator, the courier contracts checked against the pricing, statistics, and notices to pilots and customers on Discord."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
discord = ["send_message"]

# Approved by Jay (2026-09-27): the contract handler's corporation's
# courier contracts. AA's setup_contract_handler adds it (aa-freight's
# "Setup contract handler").
[capabilities.esi]
data_source = ["esi-contracts.read_corporation_contracts.v1"]
owner_permissions = ["setup_contract_handler"]

# Every ten minutes, as aa-freight's contract sync.
[[capabilities.schedules]]
name = "sync"
every = "10m"

# aa-freight's permission names; `manage` stands for its admin site
# (pricing, settings).
[permissions]
basic_access = "Can access this app"
use_calculator = "Can use the calculator"
view_contracts = "Can view the contracts list"
view_statistics = "Can view freight statistics"
add_location = "Can add / update locations"
setup_contract_handler = "Can setup contract handler"
manage = "Manage pricing and settings (aa-freight's admin site)"

[permission_notes]
basic_access = "Usually Member, or whoever ships with the service. Holders open Freight: the contract handler, the priced routes, and their own courier contracts (My contracts)."
use_calculator = "Usually given with basic access, to whoever ships with the service. Holders work out a route's reward for a volume and a collateral, and how to issue the contract."
view_contracts = "For haulers and the service's staff. Holders see every outstanding and in-progress courier contract: issuers, routes, rewards, collateral and the check against the pricing."
view_statistics = "For the service's leads. Holders see the last 90 days' finished contracts by route, pilot, pilot corporation and customer."
add_location = "For the service's leads. Holders add and remove route ends: stations by ID, and structures by ID and name."
setup_contract_handler = "For the service's leads. Holders add the contract handler, a character whose corporation's courier contracts are read, and choose the operation mode. Changing either starts the contracts afresh."
manage = "For the service's leads (aa-freight's admin site). Holders set the routes' pricing and the settings: the modifier, the Discord channels and the pilots' mention, and which contracts are announced."

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "contracts"
permission = "view_contracts"

[[pages]]
path = "statistics"
permission = "view_statistics"

[[pages]]
path = "locations"
permission = "add_location"

[[pages]]
path = "pricing"
permission = "manage"

[[pages]]
path = "handler"
permission = "setup_contract_handler"

[[navigation]]
label = "Freight"
path = ""

[[views]]
label = "Overview"
path = ""

[[views]]
label = "My contracts"
path = "mine"

[[views]]
label = "Contracts"
path = "contracts"

[[views]]
label = "Statistics"
path = "statistics"

[[manage]]
label = "Contract handler"
path = "handler"

[[manage]]
label = "Locations"
path = "locations"

[[manage]]
label = "Pricing"
path = "pricing"
