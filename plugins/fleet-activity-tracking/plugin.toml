# Fleet Activity Tracking, a first-party Tether plugin. `scripts/package-plugin.sh`
# builds, zips and signs it, putting the publisher's key in below.
[plugin]
id = "tether.fleet-activity-tracking"
name = "Fleet Activity Tracking"
version = "0.3.1"
host_api = "1"
description = "FAT links for fleets, with fleet types and expiry, registered by pilots online in EVE (their system and ship recorded), or an FC's ESI fleet tracked while it runs; stats per alliance, corporation, pilot and month."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
# aa-afat's "use doctrines from Fittings": Create FAT Link offers the
# doctrines Fittings shares that the FC may see.
doctrines = "read"

[capabilities.esi]
# aa-afat's add_fat: registering attendance needs the character online,
# and records its system and ship. Pilots register their characters for
# this app with these (as aa-afat's token_required asks for them).
user = [
    "esi-location.read_location.v1",
    "esi-location.read_ship_type.v1",
    "esi-location.read_online.v1",
]
# ESI-tracked fleets (aa-afat's): an FC with add_fatlink logs in with the
# fleet boss from Create FAT Link, which adds it as this app's data source
# (Add owner; no approval, as in aa-afat); nobody else is asked for the
# scope. It exposes the fleets that character is boss of: every member,
# their ship and their system, each minute while tracked. The host reads
# only a fleet that character is boss of.
data_source = ["esi-fleets.read_fleet.v1"]

# Clears out old logs.
[[capabilities.schedules]]
name = "housekeeping"
every = "1d"

# Reports FAT counts for the Secure Groups filter below.
[[capabilities.schedules]]
name = "report_filters"
every = "1h"

# aa-afat's permissions. Grant Member basic_access; FCs add_fatlink;
# fleet officers manage_afat; leadership the statistics and logs.
[permissions]
basic_access = "Can access Fleet Activity Tracking: register FATs and see your own"
add_fatlink = "Can create FAT links, and change any FAT link (as aa-afat)"
manage_afat = "Can manage Fleet Activity Tracking: every FAT link, removing FATs, deleting links, fleet types, settings"
stats_corporation_own = "Can see own corporation statistics"
stats_corporation_other = "Can see statistics of other corporations and of alliances"
log_view = "Can view the modules log"

# 0.2 called aa-afat's log_view "logs_view"; its grants move.
[renamed_permissions]
logs_view = "log_view"

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "fleet-types"
permission = "manage_afat"

[[pages]]
path = "settings"
permission = "manage_afat"

[[pages]]
path = "logs"
permission = "log_view"

[[navigation]]
label = "Fleet Activity Tracking"
path = ""
section = "fleet"

# aa-securegroups' FAT filter: at least N FATs in the last D days, added up
# across an account's characters (Tether adds them; the app reports each
# character's count).
[[filters]]
name = "fats"
label = "FATs in the last days"
combine = "sum"

[[filters.fields]]
name = "days"
label = "Days"
kind = "number"
