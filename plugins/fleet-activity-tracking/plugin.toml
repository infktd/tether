# Fleet Activity Tracking, a first-party Tether plugin. `scripts/package-plugin.sh`
# builds, zips and signs it, putting the publisher's key in below.
[plugin]
id = "tether.fleet-activity-tracking"
name = "Fleet Activity Tracking"
version = "0.1.0"
host_api = "1"
description = "FAT links for fleets, with fleet types and expiry, or an FC's ESI fleet tracked while it runs (a data source's esi-fleets.read_fleet.v1 shows the fleets it bosses: members, ships, systems); stats per alliance, corporation, pilot and month."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

[capabilities.esi]
# ESI-tracked fleets (aa-afat's): an FC offers their character as this
# app's data source and an admin approves it once; nobody else is asked
# for the scope. It exposes the fleets that character is boss of: every
# member, their ship and their system, each minute while tracked. The host
# reads only a fleet that character is boss of.
data_source = ["esi-fleets.read_fleet.v1"]

# Clears out old logs.
[[capabilities.schedules]]
name = "housekeeping"
every = "1d"

# Reports FAT counts for the Secure Groups filter below.
[[capabilities.schedules]]
name = "report_filters"
every = "1h"

# aa-afat's permissions. Grant Member basic_access; FCs add_fatlink;
# fleet officers manage_afat; leadership the statistics and logs.
[permissions]
basic_access = "Can access Fleet Activity Tracking: register FATs and see your own"
add_fatlink = "Can create FAT links, and change the ones you created"
manage_afat = "Can manage Fleet Activity Tracking: every FAT link, manual FATs, deleting, fleet types"
stats_corporation_own = "Can see own corporation statistics"
stats_corporation_other = "Can see statistics of other corporations and of alliances"
logs_view = "Can view the app's logs"

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "fleet-types"
permission = "manage_afat"

[[pages]]
path = "logs"
permission = "logs_view"

[[navigation]]
label = "Fleet Activity Tracking"
path = ""

# aa-securegroups' FAT filter: at least N FATs in the last D days, added up
# across an account's characters (Tether adds them; the app reports each
# character's count).
[[filters]]
name = "fats"
label = "FATs in the last days"
combine = "sum"

[[filters.fields]]
name = "days"
label = "Days"
kind = "number"
