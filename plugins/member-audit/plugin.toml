# Member Audit, a first-party Tether plugin. `scripts/package-plugin.sh`
# builds, zips and signs it, putting the publisher's key in below.
[plugin]
id = "tether.member-audit"
name = "Member Audit"
icon = "scan-user"
version = "0.4.9"
host_api = "1"
description = "A full character viewer (aa-memberaudit's): skills and queue, assets, wallet, contracts, clones and implants, mail, industry, planets, contacts, killmails and more; Character Finder, Skill Sets and reports."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true
# aa-memberaudit's data exports: CSV files Tether writes from the rows
# Member Audit hands over, for holders of exports_access.
downloads = true

[capabilities.esi]
# aa-memberaudit's character sheet, from the characters their pilots
# register with Member Audit (its Register Character card): anyone holding
# one of its permissions, in any state. To require them of every
# character of a state (AA's compliance groups), an admin uses "Require
# Member Audit's scopes" on the States page.
user = [
    "esi-skills.read_skills.v1",
    "esi-skills.read_skillqueue.v1",
    "esi-assets.read_assets.v1",
    "esi-wallet.read_character_wallet.v1",
    "esi-clones.read_clones.v1",
    "esi-clones.read_implants.v1",
    "esi-location.read_location.v1",
    "esi-location.read_ship_type.v1",
    "esi-contracts.read_character_contracts.v1",
    "esi-characters.read_contacts.v1",
    "esi-characters.read_standings.v1",
    "esi-mail.read_mail.v1",
    "esi-characters.read_loyalty.v1",
    "esi-planets.manage_planets.v1",
    "esi-industry.read_character_jobs.v1",
    "esi-characters.read_blueprints.v1",
    "esi-markets.read_character_orders.v1",
    "esi-killmails.read_killmails.v1",
    "esi-characters.read_corporation_roles.v1",
    "esi-characters.read_titles.v1",
    "esi-industry.read_character_mining.v1",
    "esi-universe.read_structures.v1",
]

# Each section is read on its own clock (see src/sync.rs); a run that
# can't read everything due queues a follow-up a minute later.
[[capabilities.schedules]]
name = "sync"
every = "5m"

# Reports each character's answers to the Secure Groups filters below.
[[capabilities.schedules]]
name = "report_filters"
every = "1h"

# The data exports, rebuilt daily (and on request, at most hourly).
[[capabilities.schedules]]
name = "exports"
every = "1d"

# aa-memberaudit's permissions, as its own (AA's descriptions). Grant
# basic_access to whoever may use it (Member, usually). Officers:
# finder_access (the Character Finder), reports_access (Reports) and
# characters_access (opening others' sheets), with a scope:
# view_same_corporation or view_same_alliance (by the owner's main, as
# aa-memberaudit), or view_everything. Without a scope they see only their
# own characters. Whoever may open a sheet may read its mail, as in
# aa-memberaudit; every view of a mail page is in Tether's audit log.
# share_characters lets pilots share their own characters with holders of
# view_shared_characters (recruiters). manage is Tether's: skill sets and
# the app's settings (aa-memberaudit keeps both in Django's admin).
[permissions]
basic_access = "Can access this app, register, and view own characters"
share_characters = "Can share his/her characters"
finder_access = "Can access character finder feature"
reports_access = "Can access reports feature"
characters_access = "Can view characters owned by others, mail included, within a view scope below (every mail view audited)"
view_shared_characters = "Can view shared characters, mail included (every mail view audited)"
view_same_corporation = "Can view corporation characters (pilots whose main is in your main's corporation)"
view_same_alliance = "Can view alliance characters (pilots whose main is in your main's alliance)"
view_everything = "Can view all characters"
view_skill_sets = "Can view skill sets for a character"
# aa-memberaudit's: told when a pilot in your view scope drops a character
# (Tether sends the notice when a character is unregistered).
notified_on_character_removal = "Notified when member drops character"
exports_access = "Can access data exports (every character's contracts and wallet journal)"
manage = "Create, change, copy and delete skill sets and their groups, and change Member Audit's settings"

# Who each is for, for admins deciding whom to grant it (Permissions
# shows it under the description).
[permission_notes]
basic_access = "Usually Member, and any state whose pilots should register their characters (a state that requires Member Audit needs it). Holders register characters and see their own characters' sheets and mail, nobody else's."
share_characters = "Usually Member, where recruiters vet applicants. Holders share their own characters, mail included, with recruiters who view shared characters, until they stop sharing or the sharing timeout ends it."
finder_access = "For officers and recruiters. Holders list every character of the pilots in their view scope (only their own without one), unregistered ones too, with each one's main and state, and opening those sheets takes viewing characters owned by others too."
reports_access = "For officers who check doctrine readiness and registration. Reports count who can use each skill set, and which pilots and corporations have every character registered, among those in the holder's view scope; without a scope, only their own."
characters_access = "For officers who audit members, so keep it to trusted staff. Holders open the whole sheet of every character in their view scope (only their own without one), mail included, and every mail view is in the audit log."
view_shared_characters = "For recruiters. Holders find and open the characters pilots chose to share with them, mail included, and every mail view is in the audit log."
view_same_corporation = "A view scope for corporation officers: every character of pilots whose main is in the holder's main's corporation, alts elsewhere included. Alone it shows nothing: it widens the finder, reports and viewing characters."
view_same_alliance = "A view scope for alliance officers: every character of pilots whose main is in the holder's main's alliance, alts elsewhere included. Alone it shows nothing: it widens the finder, reports and viewing characters."
view_everything = "A view scope for alliance leadership and auditors: every character registered with Member Audit. With viewing characters it opens every sheet and its mail, so keep it to the few who need it."
view_skill_sets = "Usually Member. Holders see which of their characters can use each skill set (a doctrine, say), on the Skill sets page and on each sheet."
notified_on_character_removal = "For officers who watch who leaves. Holders get a Tether notice when a pilot in their view scope unregisters a character from Member Audit."
exports_access = "For leadership and auditors checking ISK and trades. Holders download every registered character's contracts, contract items and wallet journal, whatever their view scope, so keep it to the few who need it."
manage = "For Member Audit's admins. Holders add, change, copy and delete skill sets and their groups, which Secure Groups' skill set filters follow, and change the app's settings, such as how long history and mail are kept."

# What 0.2 called them: their grants move on upgrade. view_mail is gone
# (mail goes with the sheet, as aa-memberaudit's), and its grants with it.
[renamed_permissions]
basic = "basic_access"
finder = "finder_access"
characters = "characters_access"

[[pages]]
path = ""
permission = "basic_access"

[[pages]]
path = "finder"
permission = "finder_access"

[[pages]]
path = "reports"
permission = "reports_access"

[[pages]]
path = "data-export"
permission = "exports_access"

[[pages]]
path = "skill-sets"
permission = "view_skill_sets"

# Mail: every view in Tether's audit log, whoever looks.
[[pages]]
path = "mail"
permission = "basic_access"
audit = true

[[pages]]
path = "settings"
permission = "manage"

[[navigation]]
label = "Member Audit"
path = ""
section = "corporation"

# aa-securegroups' Member Audit filters. Each character passes or not;
# one passing character is enough for its account.
[[filters]]
name = "skill"
label = "Has a skill trained to a level"
combine = "any"

[[filters.fields]]
name = "skill"
label = "Skill (its exact name)"
kind = "text"

[[filters.fields]]
name = "level"
label = "Level (1 to 5)"
kind = "number"

[[filters]]
name = "skill_set"
label = "Can use a skill set"
combine = "any"

[[filters.fields]]
name = "skill_set"
label = "Skill set (its name in Member Audit)"
kind = "text"

[[filters]]
name = "asset"
label = "Has an item in their assets"
combine = "any"

[[filters.fields]]
name = "item"
label = "Item (its exact name, e.g. a ship)"
kind = "text"

[[views]]
label = "My characters"
path = ""

[[views]]
label = "Skill sets"
path = "skill-sets"

[[views]]
label = "Character finder"
path = "finder"

[[views]]
label = "Reports"
path = "reports"

[[views]]
label = "Data export"
path = "data-export"
