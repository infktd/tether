# ESI Status, a first-party Tether plugin (aa-esi-status).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.esi-status"
name = "ESI Status"
icon = "radio"
version = "0.1.5"
host_api = "1"
description = "ESI's status route by route (OK, degraded, down, recovering), as ESI reports it, and how it went over the last 24 hours."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

# ESI's status every minute, as aa-esi-status' task: a chain of jobs,
# each queuing the next. A manifest can't schedule under five minutes, so
# this schedule (and Run now) only restarts the chain when nothing has
# been stored for two minutes. Checks are kept for 24 hours; each is a
# line in the app's access log.
[[capabilities.schedules]]
name = "check"
every = "5m"

# aa-esi-status has no permissions: anyone logged in, as here.
[[pages]]
path = ""
signed_in = true

[[navigation]]
label = "ESI Status"
path = ""

# The app shell (DESIGN.md): its views, action and Manage pages.
[[views]]
label = "Overview"
path = ""
