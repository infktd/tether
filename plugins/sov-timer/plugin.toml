# Sovereignty Timer, a first-party Tether plugin (aa-sov-timer).
# `scripts/package-plugin.sh` builds, zips and signs it, putting the
# publisher's key in below.
[plugin]
id = "tether.sov-timer"
name = "Sovereignty Timer"
icon = "flag"
version = "0.1.5"
host_api = "1"
description = "Sovereignty campaigns across New Eden: the system, its defender and ADM, when it starts and, once active, how the defense is going."

[publisher]
key = "PUBLISHER_KEY"

[capabilities]
storage = true

# The campaigns, their regions, ADM and scores every 30 seconds (as
# aa-sov-timer's task), a chain of jobs; this schedule only restarts the
# chain, every five minutes, if it ever stops.
[[capabilities.schedules]]
name = "sync"
every = "5m"

# AA's permission name.
[permissions]
basic_access = "Can access the Sovereignty Timer module"

# Who each is usually for, shown under it on Permissions.
[permission_notes]
basic_access = "Usually Member, and Blue if allies fly sovereignty fights with you. Holders see every sovereignty campaign in New Eden, which is public from ESI, so it gives nothing away."

[[pages]]
path = ""
permission = "basic_access"

[[navigation]]
label = "Sovereignty Timer"
path = ""
section = "fleet"

# The app shell (DESIGN.md): its views, action and Manage pages.
[[views]]
label = "Overview"
path = ""
