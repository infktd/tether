[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/plugins/test-guest",
    "crates/plugins/test-guest-net",
    "crates/plugins/test-guest-hoard",
    "crates/plugins/test-guest-pages",
    "crates/plugins/test-guest-storage",
    "examples/hello-plugin",
    "plugins/moon-mining",
    "plugins/member-audit",
    "plugins/fleet-activity-tracking",
    "plugins/structure-timers",
    "plugins/hr-applications",
    "plugins/structures",
    "plugins/ship-replacement",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-2.0-or-later"

[workspace.dependencies]
tether-core = { path = "crates/core" }
tether-db = { path = "crates/db" }
tether-esi = { path = "crates/esi" }
tether-jobs = { path = "crates/jobs" }
tether-web = { path = "crates/web" }
tether-cli = { path = "crates/cli" }
tether-discord = { path = "crates/discord" }
tether-net = { path = "crates/net" }
tether-plugins = { path = "crates/plugins" }
tether-plugin-sdk = { path = "crates/plugin-sdk" }
tether-snapshots = { path = "crates/snapshots" }

anyhow = "1"
askama = "0.16"
axum = "0.8"
# The Stream trait axum's server-sent events take (already in the tree
# through axum, sqlx and reqwest).
futures-core = "0.3"
axum-extra = { version = "0.12", features = ["cookie"] }
chacha20poly1305 = "0.11"
# Snapshots are sealed as a STREAM (RustCrypto's construction over the
# XChaCha20-Poly1305 above; same aead 0.6). Approved by Jay.
aead-stream = { version = "0.6", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "macros",
    "migrate",
    "derive",
    "chrono",
    "json",
] }
sha2 = "0.11"
getrandom = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
insta = { version = "1", features = ["json"] }
# Verifying CCP's SSO tokens with pure-Rust crypto (no aws-lc-rs); PEM only
# in tests.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
wiremock = "0.6"
tracing = "0.1"
utoipa = { version = "6", features = ["chrono", "axum_extras"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# TLS everywhere is rustls with ring as its crypto provider, installed by
# `tether_net::install_crypto_provider` before any client is built: no
# aws-lc-sys (a C build) anywhere in the tree.
eve-esi-client = { version = "0.5.1", default-features = false, features = ["rustls-no-provider"] }
# Same version as eve-esi-client's, so no second copy. Default features off
# (they bring aws-lc-rs). Proxies are refused per client by Outbound.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
# The process-wide rustls CryptoProvider: ring. Approved by Jay.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Discord REST only (no gateway). Default features off: no brotli
# decompression; certificates are verified with the platform verifier, the
# same one reqwest uses, and rustls takes the process-wide ring provider,
# so there is no second crypto backend.
twilight-http = { version = "0.17", default-features = false, features = ["rustls-platform-verifier"] }
twilight-model = "0.17"

# Plugin runtime (tether-plugins). Default features are trimmed: no WAT
# text parser, no on-disk compile cache (zstd), no profiling, no GC
# proposals, no pooling allocator (it reserves ~6 GiB of address space per
# memory; on-demand allocation with per-store limits suits a few plugins),
# and WASIp2 only.
wasmtime = { version = "49", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "async",
    "std",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
wit-bindgen = "0.62"
# Plugin packages (tether-plugins): zip reading with deflate only (no
# bzip2, zstd, lzma or AES: packages are signed, not encrypted), plugin.toml
# parsing without the serializer, and minisign verification (no deps).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
minisign-verify = "0.2"
# Only for tether-plugins' `testing` feature (tests): signing packages the
# way minisign does (BLAKE2b-prehashed Ed25519). ed25519-dalek is already in
# the build through jsonwebtoken.
blake2 = "0.11"
ed25519-dalek = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Dependencies rarely need debug info; skipping it keeps target/ smaller and
# links faster. Our own crates keep line tables: backtraces still name files
# and lines, at a fraction of full debug info's size (use `debug = true`
# locally for a debugger).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
