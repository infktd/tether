[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/plugins/test-guest",
    "crates/plugins/test-guest-net",
    "crates/plugins/test-guest-hoard",
    "examples/hello-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
tether-core = { path = "crates/core" }
tether-db = { path = "crates/db" }
tether-esi = { path = "crates/esi" }
tether-jobs = { path = "crates/jobs" }
tether-web = { path = "crates/web" }
tether-cli = { path = "crates/cli" }
tether-discord = { path = "crates/discord" }
tether-net = { path = "crates/net" }
tether-plugins = { path = "crates/plugins" }

anyhow = "1"
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "macros",
    "migrate",
    "derive",
    "chrono",
    "json",
] }
sha2 = "0.11"
getrandom = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
insta = { version = "1", features = ["json"] }
# Verifying CCP's SSO tokens. rust_crypto keeps the path open to dropping
# aws-lc-sys (see the eve-esi-client follow-up); PEM only in tests.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
wiremock = "0.6"
tracing = "0.1"
utoipa = { version = "6", features = ["chrono", "axum_extras"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Pulls in aws-lc-sys (a C build) through reqwest's default TLS backend.
# Accepted as a build-time cost; follow-up: make reqwest's TLS backend a
# feature in eve-esi-client so the host can drop it (see PRD open questions).
eve-esi-client = "0.5"
# Only to rebuild a PKCE verifier stored in Postgres for SsoClient::exchange.
# Pinned to the exact version eve-esi-client resolves (one copy in the
# build); default features off so it can't pull in another reqwest.
oauth2 = { version = "=5.0.0", default-features = false }
# Same version and features as eve-esi-client's, so no second copy. Used for
# the wizard's callback check and `doctor`.
reqwest = "0.13"
# Discord REST only (no gateway). Default features off: no brotli
# decompression; certificates are verified with the platform verifier, the
# same one reqwest already uses. rustls picks up the aws-lc-rs provider
# already in the build, so there is no second crypto backend.
twilight-http = { version = "0.17", default-features = false, features = ["rustls-platform-verifier"] }
twilight-model = "0.17"

# Plugin runtime (tether-plugins). Default features are trimmed: no WAT
# text parser, no on-disk compile cache (zstd), no profiling, no GC
# proposals, no pooling allocator (it reserves ~6 GiB of address space per
# memory; on-demand allocation with per-store limits suits a few plugins),
# and WASIp2 only.
wasmtime = { version = "49", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "async",
    "std",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
wit-bindgen = "0.62"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Dependencies rarely need debug info; skipping it keeps target/ smaller and
# links faster. Our own crates keep full debug info.
[profile.dev.package."*"]
debug = false
