[package]
name = "tether-plugins-test-guest-pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A plugin with misbehaving pages, for tether-plugins tests. Not a real plugin."

[package.metadata.tether]
target = "wasm32-wasip2"

[lib]
crate-type = ["cdylib"]

# Workspace lints minus `unsafe_code = "forbid"` (wit-bindgen's glue needs it).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
tether-plugin-sdk.workspace = true
