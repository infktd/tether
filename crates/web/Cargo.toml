[package]
name = "tether-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fixture sessions for manual testing. Refuses to compile in release builds.
dev-login = []
# Scalar at /docs, loaded from a CDN. Refuses to compile in release builds.
dev-docs = []
# Installing an app from an uploaded .zip (POST /admin/plugins), for app
# developers testing builds; multipart reads the upload (the multer crate).
# Refuses to compile in release builds.
dev-upload = ["axum/multipart"]
# Tests only: plugin HTTP requests go to a local stand-in (wiremock).
# Refuses to compile in release builds.
plugin-http-test = []

[dependencies]
askama.workspace = true
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
futures-core.workspace = true
getrandom.workspace = true
serde.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tether-core.workspace = true
tether-esi.workspace = true
tether-jobs.workspace = true
tether-net.workspace = true
tether-plugins.workspace = true
tether-snapshots.workspace = true
thiserror.workspace = true
tether-db.workspace = true
tether-discord.workspace = true
tracing.workspace = true
tokio.workspace = true
utoipa.workspace = true

[dev-dependencies]
# The integration tests route plugin HTTP to wiremock, and install most
# test packages through the development upload route.
tether-web = { path = ".", features = ["plugin-http-test", "dev-upload"] }
futures-core.workspace = true
tether-plugins = { workspace = true, features = ["testing"] }
wiremock.workspace = true
insta.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
