[package]
name = "tether-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fixture sessions for manual testing. Refuses to compile in release builds.
dev-login = []
# Scalar at /docs, loaded from a CDN. Refuses to compile in release builds.
dev-docs = []

[dependencies]
askama.workspace = true
# multipart: plugin package uploads (the multer crate).
axum = { workspace = true, features = ["multipart"] }
axum-extra.workspace = true
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tether-core.workspace = true
tether-esi.workspace = true
tether-jobs.workspace = true
tether-net.workspace = true
tether-plugins.workspace = true
thiserror.workspace = true
tether-db.workspace = true
tether-discord.workspace = true
tracing.workspace = true
tokio.workspace = true
utoipa.workspace = true

[dev-dependencies]
tether-plugins = { workspace = true, features = ["testing"] }
wiremock.workspace = true
insta.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
