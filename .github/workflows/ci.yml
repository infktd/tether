name: CI

on:
  push:
    branches: [main]
    # Releases: the publish jobs at the bottom push these as images.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

# Read-only by default; only the publish jobs may write packages.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Compile-time query checks use the committed .sqlx/ data; the test job
  # verifies that data is current.
  SQLX_OFFLINE: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the channel, components and wasm target;
      # rustup installs them on first use.
      - run: rustup show
      - run: cargo fmt --all --check
      # TLS is rustls with ring: aws-lc (a C build) must not come back
      # through a dependency's default features.
      - name: No aws-lc in the build
        run: |
          if grep -q '^name = "aws-lc' Cargo.lock; then
            cargo tree -i aws-lc-rs -e features --target all
            exit 1
          fi

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mold
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.1-pg16
        env:
          POSTGRES_USER: tether
          POSTGRES_PASSWORD: tether
          POSTGRES_DB: tether
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tether:tether@localhost:5432/tether
      # The snapshot tests need Postgres 16's client tools; with CI set,
      # they fail rather than skip without them.
      TETHER_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mold postgresql-client-16
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Offline query data is current
        run: |
          sqlx migrate run
          SQLX_OFFLINE=false cargo sqlx prepare --workspace --check
      - run: cargo test --workspace
      - name: Tests with the dev features
        run: cargo test -p tether-web --features dev-login,dev-docs

  # dev-login signs anyone in without SSO; dev-docs loads Scalar from a CDN;
  # dev-upload installs apps from an uploaded .zip; plugin-http-test sends
  # plugins' HTTP to a local stand-in. Prove a release build refuses each
  # of them. (The Hurl tests also check the release image has no upload
  # route.)
  dev-features-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mold
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Release builds with dev features must fail
        run: |
          for feature in dev-login dev-docs dev-upload plugin-http-test; do
            if cargo check --release -p tether-server --features "$feature" 2> guard.log; then
              echo "A release build with $feature compiled; it must not."
              exit 1
            fi
            grep -q "the $feature feature must never be enabled in release builds" guard.log
            echo "Release build refused $feature, as required."
          done

  # static/app.css is committed so `cargo build` needs no extra step; this
  # rebuilds it with the pinned Tailwind CLI and fails if it's stale.
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/css.sh
      - name: Committed stylesheet is current
        run: git diff --exit-code static/app.css

  # Every crate tagged `[package.metadata.tether] target = "wasm32-wasip2"`
  # is built and linted for that target, and must come out as a component.
  # A missing `export!` only fails at wasm link time, so the native jobs
  # above can't catch it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Find wasm crates
        id: crates
        run: |
          crates=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.metadata.tether.target == "wasm32-wasip2") | .name' \
            | tr '\n' ' ')
          echo "Found: ${crates:-none}"
          echo "list=$crates" >> "$GITHUB_OUTPUT"
      - name: Lint the plugin SDK for its real target
        run: cargo clippy -p tether-plugin-sdk --target wasm32-wasip2 -- -D warnings
      - name: Build, lint and check component format
        run: |
          for crate in ${{ steps.crates.outputs.list }}; do
            cargo clippy -p "$crate" --target wasm32-wasip2 -- -D warnings
            cargo build -p "$crate" --target wasm32-wasip2 --release
            wasm="target/wasm32-wasip2/release/${crate//-/_}.wasm"
            # Component binaries have layer 1 in the header: 0d 00 01 00.
            header=$(od -An -tx1 -j4 -N4 "$wasm" | tr -d ' \n')
            if [ "$header" != "0d000100" ]; then
              echo "$wasm is not a WASM component (header $header)"
              exit 1
            fi
            echo "$wasm: component, $(stat -c %s "$wasm") bytes"
          done

  # The top rule: a fresh `docker compose up` must give a working instance.
  # Built from this commit's source (install.sh --build, through
  # docker-compose.build.yml) natively on each architecture, not pulled:
  # the publish jobs below build the same commit once everything passes.
  # The app is first started on its own, as the admin's-own-proxy option
  # runs it, then the install switches to the default Caddy and the full
  # stack is checked over HTTPS.
  docker:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from source without Caddy (--build --proxy none)
        run: deploy/install.sh --build --proxy none localhost
      # Compose starts the image's plain `tether` entrypoint with settings
      # from the environment; a regression there once left `docker compose
      # up` with no server. Checked straight on the app's port, with no
      # proxy in the way.
      - name: Image entrypoint serves /health, on 127.0.0.1 only, without Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health | grep -qx ok; then
              echo "healthy"; break
            fi
            if [ "$i" = 60 ]; then
              docker compose -f deploy/docker-compose.yml logs app
              exit 1
            fi
            sleep 2
          done
          test -z "$(docker ps -q --filter label=com.docker.compose.service=caddy)"
          test "$(cd deploy && docker compose port app 8080)" = "127.0.0.1:8080"
      - name: Switch to Caddy (re-running install.sh keeps the secrets and the build)
        run: |
          token=$(sed -n 's/^SETUP_TOKEN=//p' deploy/.env)
          deploy/install.sh --proxy caddy
          test "$(sed -n 's/^SETUP_TOKEN=//p' deploy/.env)" = "$token"
          grep -qx 'TETHER_PROXY=caddy' deploy/.env
          grep -qx 'TETHER_IMAGE=tether:local' deploy/.env
          grep -qx 'COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml' deploy/.env
      - name: Ready over HTTPS (database connected, migrations applied)
        run: |
          for i in $(seq 1 60); do
            if curl -skf https://localhost/ready | grep -qx ready; then
              echo "healthy"
              # Behind Caddy, the app's port isn't published.
              test -z "$(docker port "$(cd deploy && docker compose ps -q app)")"
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Every first-party app comes with the image
        run: |
          expected=$(ls -d plugins/*/ | wc -l)
          found=$(docker compose -f deploy/docker-compose.yml exec -T app \
            sh -c 'ls /usr/share/tether/apps/*.zip | wc -l')
          echo "bundled: $found of $expected"
          test "$found" -eq "$expected"
      - name: Install Hurl (pinned, checksum-verified)
        run: |
          arch=$(dpkg --print-architecture)
          case "$arch" in
            amd64) sha=e76e6c0957f83f9b761416452871554d0f068384b6cd004bff82dd8795c62225 ;;
            arm64) sha=7a393b9ff8c15f410657258850c9d27c3b4835b58ce43a6935cf298bb72a8c03 ;;
          esac
          curl -fsSL -o hurl.deb "https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_${arch}.deb"
          echo "$sha  hurl.deb" | sha256sum -c -
          sudo apt-get install -y ./hurl.deb
      - name: Hurl smoke tests (every page and endpoint)
        run: |
          hurl --test --insecure --jobs 1 \
            --variable base=https://localhost \
            --variable setup_token="$(sed -n 's/^SETUP_TOKEN=//p' deploy/.env)" \
            tests/hurl/*.hurl
      - name: Nightly backup taken in the image (pg_dump, the snapshots volume)
        run: |
          for i in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.yml exec -T app tether rollback --list \
                | grep -q "nightly backup"; then
              echo "backed up"; exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml exec -T app tether doctor || true
          docker compose -f deploy/docker-compose.yml logs app
          exit 1
      - name: Timescale telemetry is off
        run: |
          test "$(docker compose -f deploy/docker-compose.yml exec -T db \
            psql -U tether -tAc 'show timescaledb.telemetry_level')" = off

  # The deploy files alone, as the install without a clone downloads them
  # (deploy/README.md): install.sh pins a published image, refuses --build,
  # and each proxy's compose files resolve. Nothing is pulled or started:
  # the image for this commit isn't published yet.
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=warning deploy/install.sh
      - name: install.sh from the deploy files alone
        run: |
          dir=$RUNNER_TEMP/standalone/deploy
          mkdir -p "$dir"
          for f in docker-compose.yml docker-compose.host-proxy.yml \
              docker-compose.traefik.yml Caddyfile install.sh .env.example; do
            cp "deploy/$f" "$dir/"
          done
          cd "$dir"
          # Only GitHub's API not answering (shared runners' addresses hit
          # its rate limit) is tolerated, and then edge is pinned by hand.
          if ! ./install.sh --no-start localhost 2> err.log; then
            cat err.log
            grep -q "couldn't ask api.github.com" err.log
            echo "::warning::GitHub's API didn't answer; pinning edge instead."
            ./install.sh --version edge --no-start localhost
          fi
          grep -Eqx 'TETHER_IMAGE=ghcr\.io/infktd/tether:(edge|[0-9]+\.[0-9]+\.[0-9]+)' .env
          before=$(grep '^TETHER_IMAGE=' .env)
          ./install.sh --no-start
          test "$(grep '^TETHER_IMAGE=' .env)" = "$before"
          if ./install.sh --build --no-start; then
            echo "--build must need a clone"; exit 1
          fi
          docker compose config -q
          ./install.sh --version 1.2.3 --proxy none --no-start
          grep -qx 'TETHER_IMAGE=ghcr.io/infktd/tether:1.2.3' .env
          docker compose config -q
          test "$(docker compose config --images | grep tether)" = ghcr.io/infktd/tether:1.2.3
          printf 'TRAEFIK_NETWORK=traefik\nTRAEFIK_CERTRESOLVER=le\n' >> .env
          COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml docker compose config -q
      - name: Compose files with the build override
        working-directory: deploy
        run: |
          printf 'DOMAIN=localhost\nPOSTGRES_PASSWORD=x\nSETUP_TOKEN=x\nENCRYPTION_KEY=x\nTRAEFIK_NETWORK=traefik\nTRAEFIK_CERTRESOLVER=le\n' > .env
          for proxy in "" :docker-compose.host-proxy.yml :docker-compose.traefik.yml; do
            COMPOSE_FILE=docker-compose.yml$proxy:docker-compose.build.yml docker compose config -q
            test "$(COMPOSE_FILE=docker-compose.yml$proxy:docker-compose.build.yml \
              docker compose config --images | grep tether)" = tether:local
          done

  # Publishes the app image to GitHub's container registry, only after
  # every job above passed on this commit, and never from a pull request:
  # main as :edge and :sha-<short>, a vX.Y.Z tag as :X.Y.Z, :X.Y and
  # :latest. Each architecture builds natively on its own runner (no
  # emulation) and is pushed by digest; publish-manifest joins them into
  # one multi-arch image under those tags. A release tag must be on main,
  # and a published X.Y.Z is never replaced.
  #
  # These jobs hold a token that can write the image every install pulls,
  # so their actions are pinned to commit SHAs (the version in the
  # comment); the read-only jobs above use version tags.
  publish-image:
    if: github.event_name == 'push'
    needs: [fmt, clippy, test, dev-features-guard, css, wasm, docker, deploy-files]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check a release tag is on main.
          fetch-depth: 0
      - name: A release tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME isn't on main; releases are tagged on main."
            exit 1
          fi
      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tether" >> "$GITHUB_ENV"
          case $GITHUB_REF in
            refs/tags/v*) echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV" ;;
            *) echo "VERSION=edge" >> "$GITHUB_ENV" ;;
          esac
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Tether
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache for main's builds only. Any action in a job on a
          # main push can write the Actions cache, including the read-only
          # jobs' unpinned ones, so releases build without it.
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope=tether-{0}', matrix.arch) || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,scope=tether-{0}', matrix.arch) || '' }}
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    if: github.event_name == 'push'
    needs: publish-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A slower run for an older commit or an older release mustn't move
      # :edge, :X.Y or :latest backwards.
      - name: Tags
        shell: bash
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tether
          remote=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          case $GITHUB_REF in
            refs/heads/main)
              version=edge
              tags="$image:sha-${GITHUB_SHA::7}"
              head=$(git ls-remote "$remote" refs/heads/main | cut -f1)
              test -n "$head"
              if [ "$head" = "$GITHUB_SHA" ]; then
                tags="$tags $image:edge"
              else
                echo "main has moved on to $head; its run moves :edge."
              fi
              ;;
            refs/tags/v*)
              version=${GITHUB_REF#refs/tags/v}
              if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "$GITHUB_REF isn't a vX.Y.Z release tag"; exit 1
              fi
              if found=$(docker buildx imagetools inspect "$image:$version" 2>&1); then
                echo "::error::$image:$version is already published; a release never changes."
                exit 1
              elif ! grep -qi 'not found' <<< "$found"; then
                echo "$found"
                echo "::error::Couldn't check whether $image:$version exists."
                exit 1
              fi
              minor=${version%.*}
              releases=$(git ls-remote --tags --refs "$remote" 'v*' | sed 's#.*refs/tags/v##' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
              test -n "$releases"
              tags="$image:$version"
              if [ "$(printf '%s\n' "$releases" | awk -F. -v m="$minor" '$1 "." $2 == m' | tail -n 1)" = "$version" ]; then
                tags="$tags $image:$minor"
              else
                echo "A newer $minor.x release holds :$minor."
              fi
              if [ "$(printf '%s\n' "$releases" | tail -n 1)" = "$version" ]; then
                tags="$tags $image:latest"
              else
                echo "A newer release holds :latest."
              fi
              ;;
            *) echo "Nothing to publish for $GITHUB_REF"; exit 1 ;;
          esac
          {
            echo "IMAGE=$image"
            echo "VERSION=$version"
            echo "TAGS=$tags"
          } >> "$GITHUB_ENV"
      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          test "$(ls | wc -l)" -eq 2
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=Tether" \
            --annotation "index:org.opencontainers.image.description=Self-hosted EVE Online alliance platform" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-or-later" \
            "${args[@]}"
      - name: Inspect
        run: |
          for tag in $TAGS; do
            echo "== $tag"
            docker buildx imagetools inspect "$tag"
          done
