{%- if results.is_empty() -%}
<p class="text-sm text-muted-foreground">No alliance, corporation, character or faction has exactly that name.</p>
{%- else -%}
<div class="rounded-sm border divide-y max-w-xl">
  {% for r in results %}
  <div class="flex items-center justify-between gap-4 px-4 py-3">
    <div class="flex items-center gap-3">
      <img src="{{ r.image }}" alt="" width="32" height="32" class="avatar-img size-8">
      <div>
        <div class="font-medium">{{ r.name }}</div>
        <div class="text-xs text-muted-foreground">{{ r.kind }} · <span class="num">{{ r.id }}</span></div>
      </div>
    </div>
    <form method="post" action="/admin/states/{{ state_id }}/covers" hx-boost="true">
      <input type="hidden" name="entity_id" value="{{ r.id }}">
      <button type="submit" class="btn" data-variant="outline" data-size="sm">Add to {{ state_name }}</button>
    </form>
  </div>
  {% endfor %}
</div>
{%- endif -%}
