{#- The ping as plain text: a fragment for /pings/preview. -#}
{% if let Some(e) = error %}<div class="alert" data-variant="destructive" role="alert"><section>{{ e }}</section></div>{% endif %}
{% if let Some(t) = text %}
<div class="grid gap-2">
  <div class="label">Copy-paste text</div>
  <pre class="rounded-sm border bg-background px-3 py-2 text-sm whitespace-pre-wrap break-words select-all">{{ t }}</pre>
</div>
{% endif %}
