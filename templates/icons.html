{#- Outline icons, 16px, stroke 2, currentColor (DESIGN.md). Inline SVG,
    never fetched. -#}
{% macro icon(name) -%}
<svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- match name -%}
{%- when "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- when "settings" -%}<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>
{%- when "log-out" -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- when "plus" -%}<path d="M12 5v14M5 12h14"/>
{%- when "check" -%}<path d="M20 6 9 17l-5-5"/>
{%- when "external" -%}<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
{%- else -%}<circle cx="12" cy="12" r="9"/>
{%- endmatch -%}
</svg>
{%- endmacro %}
