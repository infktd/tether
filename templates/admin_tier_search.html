{%- if results.is_empty() -%}
<p class="text-sm text-muted-foreground">No alliance or corporation has exactly that name.</p>
{%- else -%}
<div class="rounded-sm border divide-y max-w-xl">
  {% for r in results %}
  <div class="flex items-center justify-between gap-4 px-4 py-3">
    <div>
      <div class="font-medium">{{ r.name }}</div>
      <div class="text-xs text-muted-foreground">{{ r.kind }} · <span class="num">{{ r.id }}</span></div>
    </div>
    <div class="flex gap-2">
      <form method="post" action="/admin/tiers"><input type="hidden" name="entity_id" value="{{ r.id }}"><input type="hidden" name="tier" value="member"><button type="submit" class="btn" data-variant="outline" data-size="sm">Make Member</button></form>
      <form method="post" action="/admin/tiers"><input type="hidden" name="entity_id" value="{{ r.id }}"><input type="hidden" name="tier" value="allied"><button type="submit" class="btn" data-variant="outline" data-size="sm">Make Allied</button></form>
    </div>
  </div>
  {% endfor %}
</div>
{%- endif -%}
